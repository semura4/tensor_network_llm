[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-pulse-ir"
version = "0.1.0"
description = "Exchange-only spin-qubit pulse control IR, physics simulator, and optimal-control / tensor-network toolkit"
readme = "eo_pulse_ir/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "semura4" }]
keywords = ["quantum-computing", "exchange-only", "spin-qubits", "optimal-control",
            "tensor-networks", "pulse-control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []                       # core IR is standard-library only

[project.optional-dependencies]
sim = ["numpy>=1.21"]                    # physics simulator / control / TN layers
viz = ["cairosvg"]                       # optional: rasterise the SVG artefacts

[project.scripts]
eo = "eo_pulse_ir.app:main"

[project.urls]
Repository = "https://github.com/semura4/tensor_network_llm"

[tool.setuptools]
packages = ["eo_pulse_ir", "eo_pulse_ir.sim"]
